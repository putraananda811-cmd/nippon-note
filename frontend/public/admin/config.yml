backend:
  name: github
  repo: putraananda811-cmd/nippon-note
  branch: main

# Media (gambar) yang di-upload lewat admin akan disimpan di folder ini
media_folder: "frontend/public/uploads"
public_folder: "/uploads"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "frontend/src/data/articles_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["NEWS","CULTURE","MUSIC","TRAVEL","ANIME","GAMES","FOOD","LIFESTYLE","SOCIETY","TECH","STUDY & WORK","LANGUAGE"]
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "contoh: 12 JUN 2026" }
      - { label: "Reading time", name: "reading", widget: "string", hint: "contoh: 6 min" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Content", name: "content", widget: "markdown" }
      - { label: "Featured di homepage", name: "featured", widget: "boolean", default: false }

  # Catatan: collection "Anime" SENGAJA tidak ada di sini.
  # Data anime sekarang 100% otomatis diambil dari AniList (trending musim ini)
  # setiap kali website di-build, termasuk sinopsis (auto-translate ke Indonesia).
  # Admin tidak perlu dan tidak bisa mengedit anime secara manual.

  - name: "destinations"
    label: "Destinations"
    label_singular: "Destination"
    folder: "frontend/src/data/destinations_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - label: "Region"
        name: "region"
        widget: "select"
        options: ["KANTO","KANSAI","HOKKAIDO","OKINAWA","KYUSHU","TOHOKU","CHUBU","CHUGOKU","SHIKOKU"]
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Signature Food", name: "food", widget: "string" }
      - { label: "Culture Highlights", name: "culture", widget: "string" }
      - { label: "Travel Info", name: "travel_info", widget: "string" }

  - name: "artists"
    label: "Artists"
    label_singular: "Artist"
    folder: "frontend/src/data/artists_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Latest Release", name: "latest_release", widget: "string" }
      - { label: "Album", name: "album", widget: "string", required: false }
      - { label: "Spotify URL", name: "spotify_url", widget: "string", required: false }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Featured di homepage", name: "featured", widget: "boolean", default: false }

  - name: "words"
    label: "Word of the Day"
    label_singular: "Word"
    folder: "frontend/src/data/words_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{fields.id}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Japanese", name: "japanese", widget: "string" }
      - { label: "Romaji", name: "romaji", widget: "string" }
      - { label: "Meaning", name: "meaning", widget: "string" }
      - { label: "Example", name: "example", widget: "string" }
      - { label: "Example Translation", name: "example_translation", widget: "string" }
      - { label: "Audio URL", name: "audio_url", widget: "string", required: false }

  - name: "novels"
    label: "Novels"
    label_singular: "Novel"
    folder: "frontend/src/data/novels_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - label: "Genre"
        name: "genre"
        widget: "select"
        multiple: true
        options: ["ISEKAI","LITRPG","FANTASY","ROMANCE","SLICE OF LIFE","ACTION","DRAMA","SCHOOL"]
      - { label: "Status", name: "status", widget: "select", options: ["ONGOING","COMPLETED","HIATUS"] }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Sinopsis", name: "synopsis", widget: "text" }

  - name: "chapters"
    label: "Chapters"
    label_singular: "Chapter"
    folder: "frontend/src/data/chapters_items"
    format: "json"
    extension: "json"
    create: true
    slug: "{{fields.novel_slug}}-ch{{fields.chapter_number}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - label: "Novel"
        name: "novel_slug"
        widget: "relation"
        collection: "novels"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "slug"
        hint: "Pilih novel yang mau ditambah chapter-nya"
      - { label: "Nomor Chapter", name: "chapter_number", widget: "number", value_type: "int" }
      - { label: "Judul Chapter", name: "chapter_title", widget: "string", required: false }
      - { label: "Isi Chapter", name: "content", widget: "markdown" }
      - { label: "Tanggal Publish", name: "published_date", widget: "string", hint: "contoh: 29 AGU 2026" }
